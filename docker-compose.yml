services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: transcrib
      POSTGRES_PASSWORD: transcrib
      POSTGRES_DB: transcrib
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcrib -d transcrib"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://localhost:4173,https://transcriber.itsalt.ru"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/transcrib &&
        mc cors set local/transcrib
          --allowed-origins 'http://localhost:5173'
          --allowed-origins 'http://localhost:4173'
          --allowed-origins 'https://transcriber.itsalt.ru'
          --allowed-methods 'PUT'
          --allowed-headers '*'
          --expose-headers 'ETag' || true &&
        echo 'MinIO bucket and CORS configured.'
      "
    restart: on-failure

  # Project-memory graph (WP-INFRA-01, ADR-013). Separate from the dev spec-graph
  # container `transcrib-neo4j` (3614/3627). Hard memory caps per D-16: on OOM the
  # JVM exits and `restart` brings the container back instead of hanging.
  memory-neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          memory: 1536m
    environment:
      NEO4J_AUTH: neo4j/${MEMORY_NEO4J_PASSWORD:-memory_dev_password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_db_memory_transaction_total_max: 256m
      NEO4J_server_jvm_additional: -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - memory_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  memory_neo4j_data:
