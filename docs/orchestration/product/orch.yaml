# Program configuration for the pepper-orchestrator workspace.
# Read by orch.py (YAML subset: block maps and lists, flow [..] and {..}, scalars).

# Prefix of session names and messages.
program: product
# active | closed: `close --apply` closes the program (one program, one goal), `reopen` reopens it.
state: active
# Session kind of module sessions, the owner's explicit choice at init: local (recommended) | cloud.
# Repositories and modules inherit it; a module may set its own `sessions` after an owner decision.
sessions: local
# Shell of the start commands printed by init and dispatch: bash (default) | powershell (asked on
# Windows: `cd "<dir>"; claude ...`). Written as `shell: powershell` only when chosen.
# Permission mode of the program's sessions, the owner's explicit choice at init: auto (recommended) |
# acceptEdits | default | dontAsk | bypassPermissions. dispatch passes it with --permission-mode.
permission_mode: bypassPermissions
# Owner checkpoints: actions that always ask the owner in the session window (permissions.ask),
# even in auto mode: push (every git push asks) | pr (gh pr create) | deploy_test (the
# module's deploy_test command; pushes too where every push deploys the stand).
checkpoints: [deploy_test]
title: "Модернизация Transcrib до продукта"
# [PRODUCT] in messages and PR titles.
tag: PRODUCT
# Language of owner-facing documents: en | ru.
owner_language: ru
coordinator_session: product-coord
# true: orch.py commit also pushes (the owner reads from another device).
push_after_milestone: true
# Where the workspace lives: separate (its own home repository) | in-repo (branch orch/<program>
# of a module repository, in a directory every push workflow ignores; init --in-repo sets
# workspace_branch and workspace_dir). State commits go only to workspace_branch.
# deploy_check_override: D-n is written only when the owner accepted an unverifiable deploy check.
workspace_mode: in-repo
workspace_branch: orch/product
workspace_dir: docs/orchestration/product

# Implementer models (recommendation per package; the owner may change it before starting):
# aliases sonnet | opus | fable | haiku | opusplan or a full claude-... id; effort low | medium |
# high | xhigh | max. Without `models`, start commands carry no model flags (the owner's default).
models:
  implement: sonnet
  escalate: opus
  escalate_effort: high

# Repositories shared by several modules (streams). One writing session per worktree and branch.
repos:
  - id: transcriber
    path: /home/cloudpc/projects/transcriber
    base: main
    branch_prefix: feature/
    worktree_root: .claude/worktrees
    worktree_setup: ["pnpm install --frozen-lockfile", "pnpm --filter @transcrib/api run db:generate"]
    merge_policy: sequential
    shared_paths: [pnpm-lock.yaml, "package.json", "**/package.json", "shared/**", "api/prisma/**", ".tl/{status.json,master-plan.md,changelog.md,release-status.json,deploy-plan.md}", ".tl/external-contracts/**", "graph-infra/**", "config.yaml", "CLAUDE.md", "api/src/server.ts", "worker/src/index.ts", "worker/src/job-processor.ts", "worker/src/queues.ts", "web/src/App.tsx", "web/src/i18n/**"]
    resources: [migrations, {name: graph, mode: on-demand}, {name: dev-stack, mode: on-demand}]
    checks: []
    review_setup: ["pnpm install --frozen-lockfile", "pnpm --filter @transcrib/api run db:generate", "pnpm --filter @transcrib/shared build"]
    deploy_workflows: [deploy-production.yml]
    integration_branch: main
    prod_branch: main
    delete_branch: true
    run_timeout: 1800
    verify_test: ["curl -fsS https://transcriber.itsalt.ru/api/health", "test \"$(curl -s -o /dev/null -w '%{http_code}' https://transcriber.itsalt.ru/api/meetings)\" = 401 && echo 'meetings without session -> 401 (AUTH_REQUIRED=true, R-16)'"]
    merge_method: squash
    base_deploys: prod
    verify_prod: ["curl -fsS https://transcriber.itsalt.ru/api/health", "test \"$(curl -s -o /dev/null -w '%{http_code}' https://transcriber.itsalt.ru/api/meetings)\" = 401 && echo 'meetings without session -> 401 (AUTH_REQUIRED=true, R-16)'"]
# Example repository:
#  - id: mono
#    path: ~/projects/example-monorepo
#    base: main
#    branch_prefix: feature/          # the repository's own convention
#    worktree_root: .claude/worktrees # where `claude -w` puts worktrees
#    worktree_setup: ["pnpm install --frozen-lockfile"]   # installs and generation only; secrets: .worktreeinclude
#    merge_policy: sequential         # sequential | free
#    shared_paths: [pnpm-lock.yaml, "**/package.json", "backend/migrations/**"]
#    resources: [staging, migrations, {name: ci-gate, mode: on-demand}]   # on-demand: LOCK/UNLOCK messages
#    checks: ["./scripts/check-migration-order.sh"]   # read-only commands; see below
#    review_setup: ["cp \"$ORCH_MAIN_CHECKOUT/.env\" .env", "pnpm install --frozen-lockfile"]  # review clones
#    deploy_workflows: [deploy.yml]   # or {test: [...], prod: [...]}: resume (who holds the stand) and verify (run for the SHA)
#    integration_branch: main         # branch the stand deploys from (verify --env test; default: base)
#    prod_branch: main                # branch production deploys from (verify --env prod; default: base)
#    merge_method: merge              # merge | squash | rebase: the repository's own method (deliver; never --admin)
#    delete_branch: true              # deliver deletes the merged PR branch
#    deploy_test: ./scripts/deploy.sh --target test   # non-interactive; only when a merge does not deploy the stand
#    rollback_test: "./scripts/deploy.sh --target test --ref {previous_sha}"   # optional; run on a stand failure
#    run_timeout: 1800                # seconds to wait for a deploy run or promote checks (deliver, release)
#    promote: pr                      # pr | ff: a PR integration -> prod merged with --merge, or a fast-forward push
#    release_clone: ~/projects/example-monorepo-release   # a clean clone of origin; required for promote: ff
#    backup_prod: ./scripts/backup.sh --target prod      # run by release before prod migrations; output in the ledger
#    rollback_prod: ""                # e.g. "./scripts/deploy.sh --target prod --ref {previous_sha}"; empty = the owner
#    verify_test: ["curl -fsS https://test.example.com/health"]   # read-only; env ORCH_ENV, ORCH_SHA, ORCH_WP, ORCH_BASE_URL
#    verify_prod: ["curl -fsS https://example.com/health"]        # secrets only as $VARIABLE references
#    version_url: "{base_url}/version.json"   # served version ({base_url} from web_urls, {env}); or {test: ..., prod: ...}
#    version_pattern: '"sha": "([0-9a-f]+)"'  # one group, compared with the SHA (7+ characters) or --expect-version
#    base_deploys: prod               # prod | staging | none: what a merge into base deploys
#    sessions: cloud                  # local | cloud: module sessions are cloud sessions (own clones)
#    cloud_environment: Project env   # name of the owner's cloud environment (never variable values)
#    push_deploys: true               # a push of any branch deploys the stand: sessions push only with the stand slot
#
# Paths are globs: `*` (one directory), `**` (any depth), `?` (one character), `{a,b}`
# (alternatives); `[` and `]` are literal.
# worktree_setup: commands a session runs in its new worktree - dependency installs and code generation
# only. Never copy .env files, secret/key/cert directories or .claude/ there: list the gitignored files
# in `.worktreeinclude` in the repository root (Claude Code copies them into every new worktree), and
# on macOS and Linux `.claude/settings.local.json` is read from the main checkout by every worktree
# (not on Windows: the session rules always come from the generated --settings file).
# resources: a name is held by a package from dispatch until merge or verification (mode package);
# {name: <n>, mode: on-demand} is taken only when the session sends LOCK <n> (orch.py lock acquire)
# and given back on UNLOCK or READY.
# checks: run by `orch.py overlap` and `orch.py review-start` through the shell in the repository's main checkout, env
# ORCH_BASE_REF (base ref) and ORCH_BRANCHES (active package branches, space separated), timeout
# 300 s; a non-zero exit is a finding. Checks must only read.

# Modules: a whole repository (kind: repo, `repo: <path>`) or an area/domain of a repos entry.
modules:
  - id: backend
    kind: area
    repo: transcriber
    paths: ["api/{prisma.config.ts,tsconfig.json,vitest.config.ts,README.md}", "api/prisma/**", "api/scripts/**", "api/test/**", "api/src/{config.ts,db.ts,index.ts,queue.ts,server.test.ts,prisma.smoke.test.ts,queue.test.ts,queue.regression.test.ts}", "api/src/{lib,plugins,routes,services,sse,storage}/**", "api/src/features/auth/**"]
    session: product-backend
    tests: {scoped: ["pnpm --filter @transcrib/api test"], full: ["pnpm -r typecheck", "pnpm test"]}
    methodology: {name: nacl, allowed: [nacl-tl-dev-be, nacl-tl-dev, nacl-tl-fix, nacl-tl-review, nacl-tl-regression-test, nacl-tl-verify-code, nacl-tl-sync, nacl-tl-docs, nacl-tl-stubs, nacl-sa-uc, nacl-sa-domain, nacl-sa-feature, nacl-sa-validate, nacl-tl-plan, nacl-tl-status], forbidden: [nacl-tl-release, nacl-tl-deploy, nacl-tl-deliver, nacl-tl-hotfix, nacl-tl-ship, nacl-tl-conductor, nacl-tl-full, nacl-goal, nacl-publish]}
